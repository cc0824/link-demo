server:
  address: 127.0.0.1
  port: ${PORT:8080}
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/shortlink;LOCK_TIMEOUT=1000}
    username: sa
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 1000
  jdbc:
    template:
      query-timeout: 1s
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  thymeleaf:
    cache: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  api-token: ${DEMO_API_TOKEN:}
  visitor-secret: ${VISITOR_HMAC_SECRET:}
  business-zone: Asia/Hong_Kong
