<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="一件好物，一个简单的分享入口。浏览商品，了解商品分享演示。">
    <title>一物 · 分享</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page-shell">
    <header class="site-header">
        <a class="brand" href="/" aria-label="一物分享首页"><span class="brand-mark" aria-hidden="true">一</span>一物<span class="brand-dot">·</span>分享</a>
        <a th:if="${demoEnabled}" class="text-link" href="/workbench">演示工作台 ↗</a>
    </header>
    <main id="main-content">
        <section class="home-intro">
            <p class="eyebrow"><span class="small-rule" aria-hidden="true"></span> EVERYDAY, WELL SHARED</p>
            <h1>一件好物，<br>分享一份日常。</h1>
            <p class="intro-copy">把喜欢的东西，分享给在意的人。<br>从一件简单的日常用品开始。</p>
        </section>
        <section class="featured-product" aria-labelledby="featured-title">
            <a class="featured-image" href="/products/1001" aria-label="查看轻行保温杯商品详情">
                <img src="/images/product-1001.png" alt="浅砂色保温杯的原创示意插画" width="1200" height="630">
                <span class="image-index">日常选物 / 001</span>
            </a>
            <div class="featured-copy">
                <p class="eyebrow">THE EVERYDAY EDIT</p>
                <h2 id="featured-title">轻装出发，<br>温度随行。</h2>
                <p>一只保温杯，陪伴通勤、散步，<br>和每一个平常的日子。</p>
                <a class="text-link" href="/products/1001">认识这件好物 <span aria-hidden="true">↗</span></a>
            </div>
        </section>
        <section class="sharing-note" aria-label="关于本演示">
            <span class="note-number" aria-hidden="true">01 — 02</span>
            <div><h2>从商品，到分享。</h2><p>这是一个商品分享演示。打开商品了解详情，通过分享卡片回到商品页面。</p></div>
            <a class="text-link" href="/products/1002">查看商品 1002 ↗</a>
        </section>
    </main>
    <footer class="site-footer"><span>一物 · 分享</span><span>让好物与日常相遇</span></footer>
</div>

</html>
