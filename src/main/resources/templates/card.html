<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">好物分享 · 一物</title>
    <meta property="og:type" content="product">
    <meta property="og:title" th:content="${title}" content="好物分享">
    <meta property="og:description" th:content="${description}" content="一件好物，一份日常。">
    <meta property="og:image" th:content="${imageUrl}" content="">
    <meta property="og:url" th:content="${canonicalUrl}" content="">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page-shell">
    <header class="site-header"><a class="brand" href="/" aria-label="一物分享首页"><span class="brand-mark" aria-hidden="true">一</span>一物<span class="brand-dot">·</span>分享</a><span class="header-note">一份好物分享</span></header>
    <main class="detail-layout" id="main-content">
        <div class="detail-image"><img th:src="${imageUrl}" src="/images/default-product.png" th:alt="${title}" alt="商品示意插画" width="1200" height="630"><span class="image-caption">一物选物 · 原创示意插画</span></div>
        <section class="detail-copy">
            <p class="eyebrow">SOMETHING GOOD TO SHARE</p>
            <span class="status-label" th:if="${!active}">分享已失效</span>
            <h1 th:text="${title}">好物分享</h1>
            <p class="product-description" th:text="${description}">一件好物，一份日常。</p>
            <div class="detail-action" th:if="${active}"><a class="button" th:href="${shortUrl}">查看商品 <span aria-hidden="true">↗</span></a><p class="action-note">让这份分享，成为新的相遇。</p></div>
            <div class="detail-action" th:unless="${active}"><p class="action-note">这份分享暂时无法打开，欢迎回到首页看看。</p><a class="text-link" href="/">返回首页 <span aria-hidden="true">↗</span></a></div>
            <div class="detail-bottom"><span class="demo-label">商品分享演示</span><span>一物 · 分享</span></div>
        </section>
    </main>
    <footer class="site-footer"><span>好物，值得被看见</span><a href="/">回到一物首页</a></footer>
</div>
</body>
</html>
