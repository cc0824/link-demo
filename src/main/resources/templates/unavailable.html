<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">分享暂不可用 · 一物</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="page-shell">
    <header class="site-header"><a class="brand" href="/" aria-label="一物分享首页"><span class="brand-mark" aria-hidden="true">一</span>一物<span class="brand-dot">·</span>分享</a><span class="header-note">一份好物分享</span></header>
    <main class="message-page" id="main-content">
        <div class="message-symbol" aria-hidden="true">—</div>
        <p class="eyebrow">UNTIL THE NEXT GOOD FIND</p>
        <p class="error-code" th:text="${status}">410</p>
        <h1 th:text="${title}">这份分享暂不可用</h1>
        <p class="message-copy" th:text="${message}">分享可能已经过期，或商品暂时无法查看。回到首页，继续发现日常好物。</p>
        <a class="button" href="/">返回首页 <span aria-hidden="true">↗</span></a>
        <p class="request-id" th:if="${requestId != null}">请求编号 <span th:text="${requestId}"></span></p>
    </main>
    <footer class="site-footer"><span>一物 · 分享</span><span>让好物与日常相遇</span></footer>
</div>
</body>
</html>
